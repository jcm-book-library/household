<title>Household</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Household: week view, cleaning zones, groceries and jobs. Dark-only, same family as The Brain. */
:root{
  --bg:#15141c; --surface:#1d1b27; --raise:#272435; --line:#34304a;
  --fg:#f1effa; --muted:#a39fbd; --accent:#a99cff; --accent-ink:#15141c; --danger:#ff7a7a; --ok:#7bc98f; --warn:#f2c35c; --home:#5fc8c2;
  --bin-red:#ff7a7a; --bin-yellow:#f2c35c; --bin-green:#7bc98f; --bin-purple:#c39cf0; --bin-none:#a39fbd;
  --display:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--body);margin:0;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3,.num{font-family:var(--display)}
h1{font-size:clamp(24px,3.4vw,30px);font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:14px;margin:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:transparent}
.btn-sm{padding:3px 10px;font-size:12px}
.iconbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:6px;line-height:1}
.iconbtn:hover{color:var(--fg);background:var(--raise)}
.linkish{border:0;background:transparent;color:var(--fg);padding:0;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.linkish:hover{color:var(--accent)}
input,select,textarea{font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none;padding:0}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.lockup{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;flex:none}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status[data-state=live] .dot{background:var(--ok)}
.status[data-state=error] .dot{background:var(--danger)}
.status[data-state=loading] .dot{background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.status[data-state=loading] .dot{animation:none}}
.notice{background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;overflow-wrap:anywhere}
.notice[data-kind=error]{border-left-color:var(--danger)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--fg);padding:8px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner[hidden],.notice[hidden],#gate[hidden]{display:none}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected=true]{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
body[data-gate] .tabs,body[data-gate] main{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel + .panel{margin-top:16px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.empty{font-size:14px;color:var(--muted);padding:8px 0;margin:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.tag.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.tag.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}

/* week */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.weekbar .nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.navlabel{text-align:center;white-space:nowrap;min-width:11em}
.strip{margin-bottom:14px}
.sgroup{margin-top:10px}
.sgroup:first-of-type{margin-top:0}
.sgroup > .eyebrow{margin-bottom:4px;display:block}
.sgroup[data-kind=overdue]{border-left:3px solid var(--danger);padding-left:10px}
.sgroup[data-kind=overdue] > .eyebrow{color:var(--danger)}
.srows{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.srow{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0;cursor:pointer}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.srow[data-done=true] .nm{text-decoration:line-through;color:var(--muted)}
.clear{color:var(--ok);font-weight:600;margin:0}

.days{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:700px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:7px}
.dcard[data-past=true]{opacity:.62}
.dcard[data-today=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dcard-h h3{font-size:15px}
.dcard-h .w{font-size:12px;color:var(--muted);white-space:nowrap}
.dline{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.dline .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dline .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.dline[data-done=true] .nm,.dline[data-done=true] .linkish{text-decoration:line-through;color:var(--muted)}
.dline[data-muted=true]{color:var(--muted)}
.dline[data-muted=true] .nm{font-style:italic}
.dline .linkish{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bins{display:flex;flex-wrap:wrap;gap:6px}
.bin{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:2px 10px 2px 7px;font-size:12px;font-weight:700;cursor:pointer;max-width:100%}
.bin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bin[data-done=true] span{text-decoration:line-through;opacity:.7}
.bin[data-muted=true]{opacity:.55}
.bin[data-c=red]{--c:var(--bin-red)} .bin[data-c=yellow]{--c:var(--bin-yellow)} .bin[data-c=green]{--c:var(--bin-green)} .bin[data-c=purple]{--c:var(--bin-purple)} .bin[data-c=none]{--c:var(--bin-none)}
.shopline{border:0;background:color-mix(in srgb,var(--home) 12%,var(--raise));border:1px solid color-mix(in srgb,var(--home) 35%,var(--line));border-radius:8px;padding:5px 10px;text-align:left;font-size:13px;font-weight:600;width:100%}
.shopline:hover{border-color:var(--home)}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.dfree{font-size:13px;color:var(--muted)}

/* zones */
.queue{list-style:none;margin:0;padding:0;counter-reset:q}
.queue li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);min-width:0}
.queue li:first-child{border-top:0}
.queue li::before{counter-increment:q;content:counter(q);font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.qmain{flex:1;min-width:0}
.qmain .sub{font-size:13px;color:var(--muted)}
details.paused{margin-top:14px}
details.paused summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}

/* groceries */
.shopcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.shopcols{grid-template-columns:minmax(0,1fr)}}
.shopcols .panel + .panel{margin-top:0}
.glist{list-style:none;margin:0;padding:0}
.gitem{display:flex;align-items:center;gap:10px;padding:7px 2px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);min-width:0}
.gitem:first-child{border-top:0}
.gitem label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.gitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .sub{font-size:12px;color:var(--muted);white-space:nowrap}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.addrow input{flex:1 1 200px}
.addrow select{flex:0 1 120px}
.warn-box{background:color-mix(in srgb,var(--warn) 12%,var(--raise));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:8px}

/* jobs */
.agroup{margin-top:16px}
.agroup:first-child{margin-top:0}
.ahead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin:0 0 2px}
.jrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:4px 14px;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);align-items:center}
.jrow:first-of-type{border-top:0}
.jmain{min-width:0}
.jmain .sched{font-size:13px;color:var(--muted)}
.jmeta{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@media (max-width:600px){.jrow{grid-template-columns:minmax(0,1fr)}.jmeta{justify-content:flex-start}}

dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,6,14,.65)}
dialog form,dialog .dbody{padding:18px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:12px;color:var(--muted);font-weight:600}
.field.w2{grid-column:1/-1}
.field textarea{min-height:110px;resize:vertical}
.field .help{font-size:12px;color:var(--muted)}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.dlg-acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dlg-acts div{display:flex;gap:8px;flex-wrap:wrap}
.preview{font-size:13px;color:var(--accent);margin:0}
.msg{font-size:13px;color:var(--danger);margin:0;min-height:0}
.msg:empty{display:none}
.cl{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.cl label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.cl label input{margin-top:3px}
.cl label:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.plist{margin:0;padding-left:18px;max-height:44vh;overflow:auto;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
.toast[hidden]{display:none}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
</style>
<body>
<div class="wrap">
  <div class="top">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#272435"/><path d="M7.5 17.5 18 8l10.5 9.5" fill="none" stroke="#5fc8c2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="10.5" y="17" width="15" height="10.5" rx="1" fill="none" stroke="#5fc8c2" stroke-width="2.6" stroke-linejoin="round"/><rect x="16.2" y="20.5" width="3.6" height="7" rx="1" fill="#f2c35c"/></svg>
      <div><div class="eyebrow" id="todayLabel"></div><h1>Household</h1></div>
    </div>
    <div class="status" id="status" data-state="loading"><span class="dot"></span><span id="statusText">Starting…</span>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
      <button class="btn btn-ghost" id="settingsBtn" type="button">Settings</button>
    </div>
  </div>
  <div id="demoBanner" class="banner" hidden><span><b>Demo:</b> sample data, nothing is saved.</span><a class="btn btn-sm" href="?" id="exitDemo" style="text-decoration:none">Exit demo</a></div>
  <div id="notice" class="notice" hidden></div>
  <div id="gate" class="panel" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="week" aria-selected="true">Week</button>
    <button class="tab" role="tab" data-tab="zones" aria-selected="false">Zones</button>
    <button class="tab" role="tab" data-tab="groceries" aria-selected="false">Groceries</button>
    <button class="tab" role="tab" data-tab="jobs" aria-selected="false">Jobs</button>
  </div>

  <main id="main">
    <section id="v-week">
      <div class="weekbar">
        <div class="nav">
          <button class="btn" id="prevWk" type="button" aria-label="Previous week">‹</button>
          <h2 id="weekTitle" class="navlabel"></h2>
          <button class="btn" id="nextWk" type="button" aria-label="Next week">›</button>
          <button class="btn btn-ghost" id="todayBtn" type="button">Today</button>
        </div>
      </div>
      <div class="panel strip" id="strip"></div>
      <div class="days" id="days"></div>
    </section>
    <section id="v-zones" hidden><div id="zonesBody"></div></section>
    <section id="v-groceries" hidden><div id="grocBody"></div></section>
    <section id="v-jobs" hidden><div id="jobsBody"></div></section>
  </main>
</div>

<dialog id="askDlg"><div class="dbody">
  <h2 id="askTitle"></h2><div id="askBody"></div>
  <div class="dlg-acts"><span></span><div><button class="btn" type="button" id="askNo">Cancel</button><button class="btn btn-primary" type="button" id="askYes">OK</button></div></div>
</div></dialog>

<dialog id="clDlg"><div class="dbody">
  <h2 id="clTitle">Checklist</h2><p class="muted" style="margin:0;font-size:13px">For doing, not saved.</p>
  <div class="cl" id="clBody"></div>
  <div class="dlg-acts"><button class="btn" type="button" id="clEdit">Edit zone</button><div><button class="btn btn-primary" type="button" data-close>Close</button></div></div>
</div></dialog>

<dialog id="zoneDlg"><form method="dialog" id="zoneForm">
  <h2 id="zoneDlgTitle">Zone</h2>
  <div class="fields">
    <div class="field w2"><label for="zName">Zone</label><input id="zName" required></div>
    <div class="field"><label for="zOrder">Order</label><input id="zOrder" type="number" min="0" inputmode="numeric"></div>
    <div class="field"><label for="zMins">Minutes</label><input id="zMins" type="number" min="0" inputmode="numeric"></div>
    <div class="field w2"><label for="zList">Checklist (one item per line)</label><textarea id="zList"></textarea></div>
  </div>
  <div class="checks"><label><input type="checkbox" id="zActive"> Active</label></div>
  <p class="msg" id="zMsg"></p>
  <div class="dlg-acts"><span></span><div><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></div>
</form></dialog>

<dialog id="jobDlg"><form method="dialog" id="jobForm">
  <h2 id="jobDlgTitle">Job</h2>
  <div class="fields">
    <div class="field w2"><label for="jJob">Job</label><input id="jJob" required></div>
    <div class="field"><label for="jArea">Area</label><input id="jArea" list="areaList" autocomplete="off"><datalist id="areaList"></datalist></div>
    <div class="field"><label for="jMode">Mode</label><select id="jMode"><option>Fixed</option><option>Floating</option></select></div>
    <div class="field w2" id="fLink"><label for="jLink">Day before… (e.g. gardening before the green bin)</label><select id="jLink"></select></div>
    <div class="field" id="fEvery"><label for="jEvery">Every</label><input id="jEvery" type="number" min="1" inputmode="numeric" value="1"></div>
    <div class="field" id="fUnit"><label for="jUnit">Unit</label><select id="jUnit"><option value="day">days</option><option value="week">weeks</option><option value="month">months</option></select></div>
    <div class="field" id="fAnchor"><label for="jAnchor" id="jAnchorLab">Starts / first date</label><input id="jAnchor" type="date"></div>
    <div class="field"><label for="jDay" id="jDayLab">Day</label><input id="jDay" list="dayOpts" autocomplete="off" placeholder="Mon…Sun, 1–31 or last"><datalist id="dayOpts"></datalist></div>
    <div class="field"><label for="jMins">Minutes</label><input id="jMins" type="number" min="0" inputmode="numeric"></div>
    <div class="field" id="fMissed"><label for="jMissed">If missed</label><select id="jMissed"><option value="Roll">Roll: stays on the list until done</option><option value="Skip">Skip: drop it, wait for the next one</option></select></div>
    <div class="field w2"><label for="jNotes">Notes</label><input id="jNotes"></div>
  </div>
  <p class="preview" id="jPreview"></p>
  <div class="checks"><label><input type="checkbox" id="jActive"> Active</label></div>
  <p class="msg" id="jMsg"></p>
  <div class="dlg-acts"><span></span><div><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></div>
</form></dialog>

<dialog id="itemDlg"><form method="dialog" id="itemForm">
  <h2>Grocery item</h2>
  <div class="fields">
    <div class="field w2"><label for="gItem">Item</label><input id="gItem" required></div>
    <div class="field"><label for="gShop">Shop</label><select id="gShop"><option>Any</option><option>Light</option><option>Heavy</option></select></div>
    <div class="field"><label for="gRestock">Restock days</label><input id="gRestock" type="number" min="0" inputmode="numeric" placeholder="blank = not a staple"></div>
    <div class="field w2"><label for="gNotes">Notes</label><input id="gNotes"></div>
  </div>
  <p class="msg" id="gMsg"></p>
  <div class="dlg-acts"><span></span><div><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></div>
</form></dialog>

<dialog id="setDlg"><form method="dialog" id="setForm">
  <h2>Settings</h2>
  <div class="field"><label for="sSheet">Google Sheet link or ID</label><input id="sSheet" autocomplete="off"></div>
  <div class="field"><label for="sClient">OAuth Client ID</label><input id="sClient" placeholder="….apps.googleusercontent.com" autocomplete="off"></div>
  <p class="muted" style="margin:0;font-size:13px">Both are saved in this browser only. The Client ID is the same one your other apps use.</p>
  <div id="sVals">
    <div class="fields">
      <div class="field"><label for="sOffice">Office day (commute shop)</label><select id="sOffice"></select></div>
      <div class="field"><label for="sWeekend">Weekend shop day</label><select id="sWeekend"></select></div>
      <div class="field"><label for="sDelivery">Weekend shop is a delivery</label><select id="sDelivery"><option value="no">No</option><option value="yes">Yes</option></select></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* ENGINE START */
/* ---------- schedule engine (pure; dates are local yyyy-mm-dd strings, never UTC) ---------- */
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const pad = n => String(n).padStart(2, '0');

function dow(s) { return (fromIso(s).getDay() + 6) % 7; } // Mon = 0

/* n months on from s, landing on day-of-month dom (a number or 'last'), clamped to the month's length */

/* Fixed job: every date it falls on in [from, to]. Anchor sets the start and the phase (which fortnight, which month). */

function jobDates(j, from, to, jobs) {

        .forEach(x => items.push({ job: j, date: x.for, done: true, missed: false }));

/* Zone queue: active zones, longest since cleaned first (never cleaned first of all), then Order. */
function zoneQueue(zones) {

    .slice().sort((a, b) => (a.last || '') < (b.last || '') ? -1 : (a.last || '') > (b.last || '') ? 1 : (Number(a.order) || 0) - (Number(b.order) || 0));

/* Which zone goes on each zone day in [from, to]. Past days show what was cleaned (or missed); today onwards follows the queue,

/* Groceries: next shop dates, which shop an item goes in, and whether a staple is due again. */
function nextDow(today, di) { return addDays(today, (di - dow(today) + 7) % 7); }

/* ENGINE END */

/* ---------- app (everything below uses the engine's date helpers) ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const todayIso = () => iso(new Date());
const fd = s => { if (!s) return ''; const d = fromIso(s); return `${DAYS[dow(s)]} ${d.getDate()} ${MON[d.getMonth()]}`; };

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const isoToSerial = s => { const [y, m, d] = s.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5); };

/* Each tab: its title in the sheet (all start with the house emoji so they never clash), header text, and app keys in column order. */
const TABS = {
  Jobs: { title: '🏠 Jobs', key: 'id', cols: ['id', 'job', 'area', 'mode', 'every', 'unit', 'anchor', 'day', 'link', 'mins', 'missed', 'last', 'active', 'notes'],
    heads: ['id', 'Job', 'Area', 'Mode', 'Every', 'Unit', 'Anchor', 'Day', 'Linked to', 'Minutes', 'If missed', 'Last done', 'Active', 'Notes'] },
  Zones: { title: '🏠 Zones', key: 'id', cols: ['id', 'zone', 'order', 'mins', 'list', 'last', 'active'],
    heads: ['id', 'Zone', 'Order', 'Minutes', 'Checklist', 'Last cleaned', 'Active'] },
  Groceries: { title: '🏠 Groceries', key: 'id', cols: ['id', 'item', 'shop', 'status', 'restock', 'last', 'notes'],
    heads: ['id', 'Item', 'Shop', 'Status', 'Restock days', 'Last bought', 'Notes'] },
  Done: { title: '🏠 Done', key: 'id', cols: ['id', 'date', 'for', 'kind', 'ref', 'name', 'prev', 'void'],
    heads: ['id', 'Date', 'For', 'Kind', 'Ref', 'Name', 'Prev', 'Void'] },

};
const TAB_NAMES = Object.keys(TABS);
const DATE_COLS = new Set(['anchor', 'last', 'date', 'for', 'prev']); // prev holds a date too (the Last done it replaced)
const BOOL_COLS = new Set(['active', 'void']);
const NUM_COLS = new Set(['id', 'every', 'mins', 'order', 'restock', 'ref']);
const colLetter = i => String.fromCharCode(65 + i);
const lastCol = tab => colLetter(TABS[tab].cols.length - 1);
const rng = (tab, a) => `'${TABS[tab].title}'!${a}`;
const DEFAULT_SETTINGS = [
  ['office_day', 'Thu', 'Day you\'re in the Melbourne office: commute shop'],
  ['weekend_shop_day', 'Sat', 'Day of the big weekend shop'],
  ['delivery', 'no', 'yes if the weekend shop is a delivery order (placed the day before)'],
  ['zone_days', 'Mon, Tue, Wed, Thu, Fri', 'Days a cleaning zone is scheduled'],
  ['zone_minutes', 30, 'Default minutes per zone'],
  ['daily_cap', 60, 'Minutes of jobs per day before a day card is flagged busy']

const state = { data: {}, sheets: {}, missing: [], tab: 'week', weekStart: null, live: false, busy: false, demo: false, gate: '' };
const D = tab => state.data[tab] || [];
const emptyData = () => Object.fromEntries(TAB_NAMES.map(n => [n, []]));

/* ---------- Google Sheets (direct, same sign-in as the sister apps) ---------- */
const g = {
  cfgKey: 'household_config', tokKey: 'jm-google-token', client: null,
  cfg() { let c = {}; try { c = JSON.parse(localStorage.getItem(this.cfgKey) || 'null') || {}; } catch (e) {}
    if (!c.clientId) { try { const m = JSON.parse(localStorage.getItem('mbl_config') || 'null'); if (m && m.clientId) c.clientId = m.clientId; } catch (e) {} }
    return c; },
  saveCfg(c) { try { localStorage.setItem(this.cfgKey, JSON.stringify({ ...this.cfg(), ...c })); } catch (e) {} },
  tok() { try { return JSON.parse(localStorage.getItem(this.tokKey) || 'null'); } catch (e) { return null; } },
  valid() { const t = this.tok(); return !!(t && t.exp > Date.now()); },

    const body = await res.json().catch(() => ({}));

function loadGis() {
  return new Promise((ok, fail) => {
    if (window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => ok(); s.onerror = () => fail(new Error('Google sign-in didn\'t load'));
    document.head.appendChild(s);

}
function connect() { googleSignIn(); }
function googleSignIn() {
  const c = g.cfg();
  if (!c.clientId || !c.sheetId) { openSettings('Add your Client ID and Google Sheet to connect.'); return; }
  if (g.valid()) { refresh(); return; }
  if (!(window.google && google.accounts && google.accounts.oauth2)) { loadGis().then(googleSignIn, e => notice(e.message, 'error')); return; }
  try {
    if (!g.client) g.client = google.accounts.oauth2.initTokenClient({
      client_id: c.clientId, scope: 'https://www.googleapis.com/auth/spreadsheets',

function signedOut() { state.live = false; setStatus('error', 'Not connected'); $('refreshBtn').textContent = 'Connect'; setGate('connect'); }

/* ---------- read ---------- */
function parseCell(col, v) {
  if (DATE_COLS.has(col)) return toIso(v);
  if (BOOL_COLS.has(col)) { if (col === 'active' && (v === '' || v == null)) return true; return v === true || v === 'TRUE' || v === 'true'; }
  if (NUM_COLS.has(col)) { if (v === '' || v == null) return null; const n = typeof v === 'number' ? v : Number(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; }
  return v == null ? '' : String(v);
}
async function readAll() {
  const meta = await g.api('?fields=sheets.properties(sheetId,title,gridProperties.rowCount)');
  const sheets = {}; (meta.sheets || []).forEach(s => { sheets[s.properties.title] = { sid: s.properties.sheetId, rows: s.properties.gridProperties.rowCount }; });
  const missing = TAB_NAMES.filter(n => !sheets[TABS[n].title]);
  if (missing.length) return { sheets, missing, data: emptyData() };
  const q = TAB_NAMES.map(n => 'ranges=' + encodeURIComponent(rng(n, `A2:${lastCol(n)}`))).join('&');
  const res = await g.api(`/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
  const data = {};
  TAB_NAMES.forEach((n, i) => {
    const t = TABS[n], vals = (res.valueRanges[i] && res.valueRanges[i].values) || [], rows = [];
    vals.forEach((r, j) => {
      const o = { _row: j + 2 };
      t.cols.forEach((c, k) => { o[c] = parseCell(c, r[k]); });
      const kv = o[t.key]; if (kv !== '' && kv != null) rows.push(o);
    });
    data[n] = rows;
  });

}
async function refresh(keepNotice) {
  if (state.busy) return;
  if (state.demo) { setStatus('live', 'Demo'); renderAll(); return; }
  setStatus('loading', 'Loading…');
  try {
    const r = await readAll();
    state.sheets = r.sheets; state.data = r.data; state.missing = r.missing;
    if (r.missing.length) { state.live = false; setStatus('error', 'Needs set up'); setGate('setup'); return; }
    state.live = true; setGate('');
    $('refreshBtn').textContent = 'Refresh';
    setStatus('live', 'Live · ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }));
    if (!keepNotice) hideNotice();
    renderAll();
  } catch (e) {
    if (e.code !== 'signin') { setStatus('error', 'Couldn\'t load'); notice('Couldn\'t load the sheet: ' + (e.message || e), 'error'); }
  }
}

/* ---------- write (never deletes, never sorts: remove = Active FALSE, undo = Void TRUE) ---------- */
function cellOut(col, v) {
  if (BOOL_COLS.has(col)) return !!v;
  if (v == null) return '';
  if (NUM_COLS.has(col)) return v === '' ? '' : Number(v);
  if (DATE_COLS.has(col)) return v || '';
  const s = String(v);
  return /^[=+@-]/.test(s) ? "'" + s : s;
}
const rowOut = (tab, o) => TABS[tab].cols.map(c => cellOut(c, o[c]));
async function withBusy(label, fn) {
  state.busy = true; setStatus('loading', label);
  try { await fn(); state.busy = false; await refresh(); return true; }
  catch (e) {
    state.busy = false;
    if (e.code !== 'signin') { notice('Couldn\'t save: ' + (e.message || e), 'error'); await refresh(true); setStatus('error', 'Not saved'); }
    return false;
  }
}
/* Re-read the key column just before an append: the highest id and the last non-empty row. */
async function tail(tab) {
  const r = await g.api(`/values/${encodeURIComponent(rng(tab, 'A2:A'))}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
  let last = 1, max = 0;
  (r.values || []).forEach((row, i) => { const v = row && row[0]; if (v !== '' && v != null) { last = i + 2; const n = Number(v); if (!isNaN(n) && n > max) max = n; } });
  return { last, max };
}
async function ensureRows(tab, need) {
  const sh = state.sheets[TABS[tab].title] || {}, have = sh.rows || 1000;
  if (need <= have) return;
  await g.api(':batchUpdate', { method: 'POST', body: { requests: [{ appendDimension: { sheetId: sh.sid, dimension: 'ROWS', length: Math.max(500, need - have) } }] } });
  sh.rows = have + Math.max(500, need - have);
}
async function addRows(tab, objs) {
  const hasId = TABS[tab].cols[0] === 'id';
  if (state.demo) {
    const rows = state.data[tab] || (state.data[tab] = []); let max = rows.reduce((m, r) => Math.max(m, Number(r.id) || 0), 0);
    objs.forEach(o => { if (hasId) o.id = ++max; rows.push({ ...o, _row: rows.length + 2 }); });
    return objs;
  }
  const t = await tail(tab), start = t.last + 1, end = start + objs.length - 1;
  objs.forEach((o, i) => { if (hasId) o.id = t.max + 1 + i; });
  await ensureRows(tab, end);
  await g.api(`/values/${encodeURIComponent(rng(tab, `A${start}:${lastCol(tab)}${end}`))}?valueInputOption=USER_ENTERED`, { method: 'PUT', body: { values: objs.map(o => rowOut(tab, o)) } });
  return objs;
}
/* Before touching a row, check it still holds the same record (someone may have sorted or edited the sheet). */
async function assertRow(tab, o) {
  if (state.demo) return;
  const k = TABS[tab].key, ki = TABS[tab].cols.indexOf(k);

/* ---------- actions: ticking ---------- */
async function tickJob(job, date) {
  const t = todayIso(), fl = isFloating(job), last = fl ? t : (job.last && job.last > date ? job.last : date);
  const ok = await withBusy('Saving…', async () => {
    await assertRow('Jobs', job);
    await addRows('Done', [{ date: t, for: date, kind: 'Job', ref: job.id, name: job.job, prev: job.last, void: false }]);
    await updateRow('Jobs', { ...job, last });
  });
  if (ok) toast('Ticked ' + job.job, { label: 'Undo', fn: () => untick('Job', job.id, date) });
}
async function tickZone(zone, date) {
  const t = todayIso();
  const ok = await withBusy('Saving…', async () => {
    await assertRow('Zones', zone);
    await addRows('Done', [{ date: t, for: date, kind: 'Zone', ref: zone.id, name: zone.zone, prev: zone.last, void: false }]);
    await updateRow('Zones', { ...zone, last: t });
  });
  if (ok) toast('Cleaned ' + zone.zone, { label: 'Undo', fn: () => untick('Zone', zone.id, date) });
}
/* Undo = Void the Done row and put the previous Last done / cleaned back (only if nothing newer was ticked since). */
async function untick(kind, ref, date) {
  const row = doneRow(kind, ref, date); if (!row) return;
  const tab = kind === 'Job' ? 'Jobs' : 'Zones', target = D(tab).find(x => String(x.id) === String(ref));
  const restore = !!target && !D('Done').some(x => !x.void && x.kind === kind && String(x.ref) === String(ref) && x.id > row.id);
  await withBusy('Saving…', async () => {
    await assertRow('Done', row);
    if (restore) await assertRow(tab, target);
    await updateRow('Done', { ...row, void: true });
    if (restore) await updateRow(tab, { ...target, last: row.prev });
  });
}

  $('zoneDlg').close();

});
function openChecklist(z) {

/* ---------- dialogs: groceries ---------- */
function openItem(it) {

$('itemForm').addEventListener('submit', async e => {

/* ---------- dialogs: jobs ---------- */
const AREAS = ['Bins', 'Kitchen', 'Bathroom', 'Garden', 'Laundry', 'Maintenance', 'Admin'];
function jobFromForm() {
  const mode = $('jMode').value, linked = mode === 'Fixed' && $('jLink').value !== '';
  return { job: $('jJob').value.trim(), area: $('jArea').value.trim(), mode,
    every: linked || $('jEvery').value === '' ? null : Number($('jEvery').value), unit: linked ? '' : $('jUnit').value, anchor: linked ? '' : $('jAnchor').value,
    day: $('jDay').value.trim(), link: mode === 'Fixed' ? $('jLink').value : '', mins: $('jMins').value === '' ? null : Number($('jMins').value),
    missed: mode === 'Fixed' ? $('jMissed').value : '', active: $('jActive').checked, notes: $('jNotes').value.trim() };
}
function normDay(v) {
  v = String(v || '').trim(); if (!v) return { ok: true, v: '' };
  if (/^last$/i.test(v)) return { ok: true, v: 'last' };
  if (/^\d+$/.test(v)) { const n = Number(v); return n >= 1 && n <= 31 ? { ok: true, v: String(n) } : { ok: false }; }
  const i = dayIdx(v); return i >= 0 && /^[a-z]+$/i.test(v) ? { ok: true, v: DAYS[i] } : { ok: false };
}
function jobFormSync() {
  const mode = $('jMode').value, fixed = mode === 'Fixed', linked = fixed && $('jLink').value !== '';
  $('fLink').hidden = !fixed; $('fMissed').hidden = !fixed;
  $('fEvery').hidden = $('fUnit').hidden = $('fAnchor').hidden = linked;
  $('jAnchorLab').textContent = fixed ? 'Starts / first date' : 'First due (optional)';
  $('jDayLab').textContent = fixed ? 'Day' : 'Preferred day';
  jobPreview();
}
function jobPreview() {
  const t = todayIso(), f = jobFromForm(), jobs = D('Jobs').filter(j => !editing || j.id !== editing.id), el = $('jPreview');
  const tmp = { ...f, id: editing ? editing.id : -1, last: editing ? editing.last : '' }, dn = normDay(f.day);
  if (!dn.ok) { el.textContent = ''; return; }
  tmp.day = dn.v;
  if (f.mode === 'Floating') { el.textContent = 'Next due: ' + fd(floatDue(tmp, t)) + (editing && editing.last ? '' : ' (then ' + schedWords(tmp, jobs) + ')'); return; }
  if (!f.link && !f.anchor) { el.textContent = 'Pick a start date to see the next dates.'; return; }
  const ds = jobDates(tmp, t, addDays(t, 1200), [...jobs, tmp]).slice(0, 3);
  el.textContent = ds.length ? 'Next 3: ' + ds.map(fd).join(', ') : 'No upcoming dates. Check the start date and day.';
}
function openJob(j) {
  editing = j || null; const jobs = D('Jobs');
  $('jobDlgTitle').textContent = j ? 'Edit job' : 'New job';
  const areas = [...new Set([...AREAS, ...jobs.map(x => String(x.area || '').trim()).filter(Boolean)])];
  $('areaList').innerHTML = areas.map(a => `<option value="${esc(a)}">`).join('');
  $('dayOpts').innerHTML = [...DAYS, 'last', ...Array.from({ length: 31 }, (_, i) => String(i + 1))].map(a => `<option value="${a}">`).join('');
  $('jLink').innerHTML = '<option value="">No: runs on its own schedule</option>' + jobs.filter(x => !isFloating(x) && !String(x.link || '').trim() && (!j || x.id !== j.id)).map(x => `<option value="${esc(x.id)}">${esc(x.job)}</option>`).join('');
  const d = j || { job: '', area: '', mode: 'Fixed', every: 1, unit: 'week', anchor: todayIso(), day: '', link: '', mins: '', missed: 'Roll', active: true, notes: '' };
  $('jJob').value = d.job; $('jArea').value = d.area; $('jMode').value = isFloating(d) ? 'Floating' : 'Fixed'; $('jEvery').value = d.every ?? 1; $('jUnit').value = unitOf(d.unit ? d : { unit: 'week' });
  $('jAnchor').value = d.anchor || ''; $('jDay').value = d.day; $('jLink').value = String(d.link || ''); $('jMins').value = d.mins ?? ''; $('jMissed').value = String(d.missed).toLowerCase().startsWith('s') ? 'Skip' : 'Roll';
  $('jActive').checked = d.active !== false; $('jNotes').value = d.notes || ''; $('jMsg').textContent = '';
  jobFormSync(); $('jobDlg').showModal(); setTimeout(() => $('jJob').focus(), 30);
}
['jJob', 'jArea', 'jMode', 'jLink', 'jEvery', 'jUnit', 'jAnchor', 'jDay', 'jMins', 'jMissed', 'jActive'].forEach(id => { $(id).addEventListener('input', jobFormSync); $(id).addEventListener('change', jobFormSync); });
$('jobForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = jobFromForm(), dn = normDay(f.day), msg = m => { $('jMsg').textContent = m; };
  if (!f.job) return msg('Give the job a name.');
  if (!dn.ok) return msg('Day should be Mon to Sun, a number 1 to 31, or "last".');
  f.day = dn.v;
  if (f.mode === 'Fixed' && !f.link) { if (!f.anchor) return msg('Fixed jobs need a start date.'); if (!(f.every >= 1)) return msg('Every needs a number, 1 or more.'); }
  if (f.mode === 'Floating' && !(f.every >= 1)) return msg('Every needs a number, 1 or more.');
  const ed = editing; $('jobDlg').close();
  await withBusy('Saving…', () => ed ? updateRow('Jobs', { ...ed, ...f }) : addRows('Jobs', [{ ...f, last: '' }]));
});

/* Starter jobs: previewed, confirmed, appended in one write, then read back and counted. */
function starterJobs() {
  const t = todayIso(), sun = nextDow(t, 6);
  const fl = (job, area, n, unit, mins, off) => ({ job, area, mode: 'Floating', every: n, unit, anchor: addDays(t, off), day: '', link: '', mins, missed: 'Roll', last: '', active: true, notes: '' });
  return [fl('Clean fridge', 'Kitchen', 30, 'day', 20, 2), fl('Wipe oven', 'Kitchen', 2, 'month', 30, 6), fl('Descale kettle', 'Kitchen', 3, 'month', 10, 10),
    fl('Washing machine clean cycle', 'Laundry', 1, 'month', 10, 13), fl('Range hood filter', 'Kitchen', 3, 'month', 15, 17), fl('Clean windows', 'Maintenance', 6, 'month', 30, 21), fl('Test smoke alarms', 'Maintenance', 6, 'month', 10, 24),
    { job: 'Change sheets', area: 'Laundry', mode: 'Fixed', every: 2, unit: 'week', anchor: sun, day: 'Sun', link: '', mins: 20, missed: 'Roll', last: '', active: true, notes: '' },
    { job: 'Weekly reset', area: 'Admin', mode: 'Fixed', every: 1, unit: 'week', anchor: sun, day: 'Sun', link: '', mins: 15, missed: 'Roll', last: '', active: true, notes: '' }];
}
async function addStarter() {
  const rows = starterJobs(), jobs = rows.slice();
  const ok = await ask('Add starter jobs?', `<p style="margin:0 0 8px">These ${rows.length} jobs will be added to the Jobs tab. You can edit or pause any of them afterwards. Bins are left for you to add once the council dates are known.</p><ul class="plist">${rows.map(r => `<li>${esc(r.job)} <span class="muted">· ${esc(schedWords(r, jobs))}</span></li>`).join('')}</ul>`, 'Add jobs');
  if (!ok) return;
  const ready = await withBusy('Adding…', () => addRows('Jobs', rows));
  if (ready && D('Jobs').length !== rows.length) notice(`Added ${rows.length} jobs but read back ${D('Jobs').length}. Check the Jobs tab in the sheet.`, 'error');
  else if (ready) toast(`Added ${plural(rows.length, 'job')}`);
}

/* ---------- dialogs: settings ---------- */
function openSettings(msg) {
  const c = g.cfg(), live = state.live || state.demo;
  $('sSheet').value = c.sheetId || ''; $('sClient').value = c.clientId || ''; $('setMsg').textContent = msg || '';
  $('openSheet').hidden = !c.sheetId; $('openSheet').href = c.sheetId ? `https://docs.google.com/spreadsheets/d/${c.sheetId}/edit` : '#';
  $('sVals').hidden = !live;
  const dayOpts = (none) => (none ? '<option>None</option>' : '') + DAYS.map(d => `<option>${d}</option>`).join('');
  $('sOffice').innerHTML = dayOpts(true); $('sWeekend').innerHTML = dayOpts(false);
  const sel = (id, v, fallback) => { const el = $(id); el.value = v; if (el.value !== v) el.value = fallback; };
  const od = dayIdx(setting('office_day', 'Thu')), wd = dayIdx(setting('weekend_shop_day', 'Sat'));
  sel('sOffice', od >= 0 ? DAYS[od] : 'None', 'None'); sel('sWeekend', wd >= 0 ? DAYS[wd] : 'Sat', 'Sat');
  $('sDelivery').value = isDelivery() ? 'yes' : 'no'; $('sZoneMins').value = setting('zone_minutes', 30); $('sCap').value = setting('daily_cap', 60);
  const zd = zoneDays(); $('sZoneDays').innerHTML = DAYS.map((d, i) => `<label><input type="checkbox" data-zd="${i}" ${zd.includes(i) ? 'checked' : ''}> ${d}</label>`).join('');

}
$('setForm').addEventListener('submit', async e => {
  e.preventDefault();
  const raw = $('sSheet').value.trim(), m = raw.match(/\/d\/([\w-]{20,})/), id = m ? m[1] : raw, cl = $('sClient').value.trim();
  if (id && !/^[\w-]{20,}$/.test(id)) { $('setMsg').textContent = 'That doesn\'t look like a sheet link or ID.'; return; }
  if (cl && !/\.apps\.googleusercontent\.com$/.test(cl)) { $('setMsg').textContent = 'That doesn\'t look like a Client ID.'; return; }
  const was = g.cfg(), changed = id !== (was.sheetId || '') || cl !== (was.clientId || '');
  if (!state.demo && !id) { $('setMsg').textContent = 'Add the Google Sheet link or ID.'; return; }
  const vals = { office_day: $('sOffice').value, weekend_shop_day: $('sWeekend').value, delivery: $('sDelivery').value, zone_days: DAYS.filter((d, i) => document.querySelector(`#sZoneDays [data-zd="${i}"]`).checked).join(', '), zone_minutes: $('sZoneMins').value, daily_cap: $('sCap').value };
  $('setDlg').close();
  g.saveCfg({ sheetId: id, clientId: cl });
  if (changed && !state.demo) { g.client = null; state.live = false; state.data = emptyData(); connect(); return; }
  if (!(state.live || state.demo)) { connect(); return; }
  const cur = k => { const r = D('Settings').find(x => x.key === k); return r ? String(r.value) : null; };
  const defOf = k => String(DEFAULT_SETTINGS.find(r => r[0] === k)[1]);
  const todo = Object.entries(vals).filter(([k, v]) => String(v) !== (cur(k) ?? defOf(k)));
  if (!todo.length) { renderAll(); return; }
  await withBusy('Saving…', async () => {
    for (const [k, v] of todo) {
      const r = D('Settings').find(x => x.key === k);
      if (r) await updateRow('Settings', { ...r, value: v });
      else { const def = DEFAULT_SETTINGS.find(x => x[0] === k); await addRows('Settings', [{ key: k, value: v, notes: def ? def[2] : '' }]); }
    }
  });
});
$('signOut').addEventListener('click', () => { try { localStorage.removeItem(g.tokKey); } catch (e) {} $('setDlg').close(); signedOut(); });

  add('Zones', [Z(1, 'Kitchen', 1, addDays(t, -9), 'Wipe benches\nClean stovetop\nWipe cupboard fronts\nMop floor'), Z(2, 'Bathroom', 2, addDays(t, -10), 'Scrub shower\nClean basin and taps\nClean toilet\nMop floor'),
    Z(3, 'Lounge', 3, addDays(t, -6), 'Dust surfaces\nVacuum\nStraighten cushions'), Z(4, 'Bedroom', 4, addDays(t, -8), 'Dust surfaces\nVacuum under the bed\nWipe mirrors'), Z(5, 'Study', 5, '', 'Dust desk and shelves\nEmpty bin\nVacuum'),
    Z(6, 'Laundry', 6, addDays(t, -14), 'Wipe machine and bench\nClean lint filter\nMop floor'), Z(7, 'Entry and hallway', 7, addDays(t, -3), 'Sweep\nWipe door handles\nMop floor'), Z(8, 'Spare room', 8, '', 'Dust\nVacuum')]);
  const G = (id, item, shop, status, restock, last) => ({ id, item, shop, status, restock, last, notes: '' });
  add('Groceries', [G(1, 'Milk', 'Light', 'Need', 5, addDays(t, -4)), G(2, 'Bread', 'Light', 'Need', 4, addDays(t, -3)), G(3, 'Bananas', 'Light', 'Need', null, ''), G(4, 'Eggs', 'Any', 'Need', null, ''),
    G(5, 'Chicken thighs', 'Light', 'Need', null, ''), G(6, 'Laundry powder', 'Heavy', 'Need', null, ''), G(7, 'Rice 5kg', 'Heavy', 'Got', 60, addDays(t, -30)), G(8, 'Toilet paper', 'Heavy', 'Got', 21, addDays(t, -20)),
    G(9, 'Coffee beans', 'Any', 'Got', 14, addDays(t, -15)), G(10, 'Yoghurt', 'Light', 'Got', 7, addDays(t, -2)), G(11, 'Olive oil', 'Heavy', 'Got', null, ''), G(12, 'Bin liners', 'Any', 'Got', 45, addDays(t, -20))]);

function startDemo() {
  state.demo = true; state.live = true; state.data = demoData(); state.missing = [];
  setGate(''); hideNotice(); $('demoBanner').hidden = false; $('refreshBtn').hidden = true; setStatus('live', 'Demo');

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-goto],[data-zonelist],[data-editzone],[data-newzone],[data-editjob],[data-newjob],[data-edititem],[data-need]');
  if (!el) return;
  if (el.dataset.act) { const a = el.dataset.act; if (a === 'setup') setupSheet(); else if (a === 'connect') connect(); else if (a === 'settings') openSettings(); else if (a === 'demo') startDemo(); else if (a === 'starter') addStarter(); return; }
  if (el.dataset.goto) { showTab(el.dataset.goto); window.scrollTo({ top: 0 }); return; }
  if (el.dataset.zonelist) { openChecklist(D('Zones').find(z => String(z.id) === el.dataset.zonelist)); return; }
  if (el.dataset.editzone) { openZone(D('Zones').find(z => String(z.id) === el.dataset.editzone)); return; }
  if (el.hasAttribute('data-newzone')) { openZone(null); return; }
  if (el.dataset.editjob) { openJob(D('Jobs').find(j => String(j.id) === el.dataset.editjob)); return; }
  if (el.hasAttribute('data-newjob')) { openJob(null); return; }
  if (el.dataset.edititem) { const it = D('Groceries').find(x => String(x.id) === el.dataset.edititem); if (it) openItem(it); return; }
  if (el.dataset.need) { const it = D('Groceries').find(x => String(x.id) === el.dataset.need); if (it) await withBusy('Saving…', () => updateRow('Groceries', { ...it, status: 'Need' })); return; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.job) {
    const job = D('Jobs').find(j => String(j.id) === t.dataset.job); if (!job) return;
    if (t.checked) await tickJob(job, t.dataset.date); else await untick('Job', job.id, t.dataset.date);
  } else if (t.dataset.zone) {
    const z = D('Zones').find(x => String(x.id) === t.dataset.zone); if (!z) return;
    if (t.checked) await tickZone(z, t.dataset.date); else await untick('Zone', z.id, t.dataset.date);
  } else if (t.dataset.bought) {
    const it = D('Groceries').find(x => String(x.id) === t.dataset.bought);
    if (it && await withBusy('Saving…', () => updateRow('Groceries', { ...it, status: 'Got', last: todayIso() }))) toast('Bought ' + it.item);
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'quickAdd') return;
  e.preventDefault();
  const name = $('qaItem').value.trim(); if (!name) return;
  const ex = D('Groceries').find(x => x.item.toLowerCase() === name.toLowerCase());
  if (ex) { if (await withBusy('Saving…', () => updateRow('Groceries', { ...ex, status: 'Need' }))) toast(ex.item + ' is on the list'); return; }
  await withBusy('Adding…', () => addRows('Groceries', [{ item: name, shop: $('qaShop').value, status: 'Need', restock: null, last: '', notes: '' }]));
});
function showTab(t) {
  state.tab = t; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  document.querySelectorAll('section[id^=v-]').forEach(s => { s.hidden = s.id !== 'v-' + t; });
  try { localStorage.setItem('household-tab', t); } catch (e) {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
const weekMove = n => { state.weekStart = addDays(state.weekStart || mondayOf(todayIso()), n); renderWeek(); };
$('prevWk').addEventListener('click', () => weekMove(-7));
$('nextWk').addEventListener('click', () => weekMove(7));
$('todayBtn').addEventListener('click', () => { state.weekStart = mondayOf(todayIso()); renderWeek(); });
$('settingsBtn').addEventListener('click', () => openSettings());
$('exitDemo').addEventListener('click', e => { e.preventDefault(); location.href = location.pathname; });
$('refreshBtn').addEventListener('click', () => state.live || g.valid() ? refresh() : connect());
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.live && !state.busy && !state.demo) refresh(); });
setInterval(() => {
  if (!state.live || state.busy || document.querySelector('dialog[open]')) return;
  if (state.day !== todayIso()) { state.day = todayIso(); state.weekStart = mondayOf(state.day); }
  renderAll();
}, 60e3);

/* ---------- boot ---------- */
(async () => {
  state.day = todayIso(); state.weekStart = mondayOf(state.day);
  try { const t = localStorage.getItem('household-tab'); if (t && $('v-' + t)) showTab(t); } catch (e) {}
  if (/[?&]demo(&|=|$)/.test(location.search)) { startDemo(); return; }
  setStatus('loading', 'Connecting…');
  loadGis().catch(() => {});
  const c = g.cfg();
  if (g.valid() && c.sheetId) { await refresh(); return; }
  signedOut();
})();
</script>
